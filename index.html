<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324F">
<title>GoldCool Sale Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#17324F;--navy2:#22476E;--gold:#C08A12;--gold2:#FBF1DA;--bg:#F2F4F7;--card:#fff;--line:#E4E7EC;--text:#18212F;--mute:#667085;--ok:#12805C;--mid:#B7791F;--bad:#C2410C;--me:#D9ECFF;--chatbg:#E6ECF2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Be Vietnam Pro',-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .logo{font-weight:800;letter-spacing:.6px;color:#F3C34E}.top .sub{opacity:.75;font-size:13px}.top .sp{flex:1}.top .who{font-size:13px;opacity:.9}
main{max-width:600px;margin:0 auto;padding:14px 14px 96px}
body.admin main{max-width:1080px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:160px;border:0;background:none;padding:8px 4px 9px;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}.tabs button.on{color:var(--navy)}.tabs button.on svg{stroke:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px;color:var(--navy)}h3{font-size:14px;margin:14px 0 6px;color:var(--navy)}
.mute{color:var(--mute);font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--gold);color:#fff}
.btn.navy{background:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.block{width:100%}.btn:disabled{opacity:.55}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#EEF2F6;color:var(--navy2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sc{min-width:44px;height:30px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero .mute{color:#C9D5E3}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#F3C34E calc(var(--p)*1%),#ffffff26 0);display:grid;place-items:center;flex:none}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--navy);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:22px}.ring span{font-size:11px;color:#C9D5E3}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kp div{background:#ffffff14;border-radius:12px;padding:8px 10px}.kp b{display:block;font-size:18px}.kp span{font-size:11px;color:var(--mute)}.hero .kp span{color:#C9D5E3}
.gp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gp .g{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}.gp .g b{font-size:13px;display:block;line-height:1.3}
.prog{height:6px;background:#EDF0F4;border-radius:99px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.task{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.task .n{width:30px;height:30px;border-radius:50%;background:#EEF2F6;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--navy);flex:none}
.task.next{background:var(--gold2);border-radius:12px;padding:12px 10px;border:0;margin:4px 0}.task.next .n{background:var(--gold);color:#fff}
.task .t{flex:1;min-width:0}.task .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .go{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}.list .it:last-child{border:0}.list .it .t{flex:1;min-width:0}
.bar{height:8px;background:#EDF0F4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.flag{background:#FFF1EA;color:var(--bad);border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:600;font-size:14px}
.pre{white-space:pre-wrap;background:#FFFBF0;border:1px solid #F1E3BF;padding:10px 12px;border-radius:12px;line-height:1.55;font-size:14px}
ul.c{margin:4px 0;padding-left:18px}ul.c li{margin:3px 0}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:12px}
.tw{overflow-x:auto}.cell{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:700;font-size:13px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.hide{display:none!important}
/* màn hình phủ (chat, chi tiết) */
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.screen .bar2{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.screen .bar2 .back{border:0;background:none;color:#fff;font-size:22px;padding:2px 8px}
.screen .bar2 .ttl{flex:1;min-width:0;line-height:1.25}.screen .bar2 .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.screen .bar2 .ttl span{font-size:12px;opacity:.8}
.av{width:38px;height:38px;border-radius:50%;background:#F3C34E;color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none}
.screen .body{flex:1;overflow-y:auto;padding:12px}
.screen .inner{max-width:720px;margin:0 auto}
.chatbody{background:var(--chatbg)}
.ctx{background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:1px solid var(--line)}
.ctx b{color:var(--navy)}
.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;background:#fff;white-space:pre-wrap;word-wrap:break-word;font-size:15px;box-shadow:0 1px 1px #0000000d}
.msg.kh .bub{border-top-left-radius:4px}.msg.me .bub{background:var(--me);border-top-right-radius:4px}
.sys{text-align:center;font-size:12px;color:var(--mute);margin:10px 0}
.typing .bub{color:var(--mute);font-style:italic}
.composer{background:#fff;border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.composer .inner{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:180px;border-radius:22px;padding:11px 14px;resize:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;flex:none;display:grid;place-items:center}
.send svg{width:20px;height:20px}
.res{background:#fff;border-radius:16px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.big{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;flex:none}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--navy)}
.seg{display:flex;background:#E9EDF2;border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:700;color:var(--mute);font-size:14px}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px #0001}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;text-align:left}.pcard.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}.pcard b{display:block;font-size:14px}.pcard span{font-size:12px;color:var(--mute)}
.login{max-width:380px;margin:8vh auto 0}
@media(min-width:900px){.gp{grid-template-columns:repeat(6,minmax(0,1fr))}}
.attach{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;flex:none;display:grid;place-items:center;color:var(--navy)}
.bub.md{padding:4px;max-width:260px}.bub.md img,.bub.md video{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:12px;background:#0b1220}
.bub.md .cap{font-size:12px;color:var(--mute);padding:4px 6px 2px}.msg.me .bub.md .cap{color:#3B5B7E}
.lnk{display:flex;gap:8px;align-items:center;padding:8px 10px;color:var(--navy);text-decoration:none;font-weight:600}.lnk i{font-style:normal;width:34px;height:34px;border-radius:8px;background:#C2410C;color:#fff;display:grid;place-items:center;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mitem{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;text-align:left;padding:0;position:relative;text-decoration:none;color:var(--text)}
.mitem img,.mitem video,.mitem .vl{width:100%;height:92px;object-fit:cover;display:block;background:#0b1220}
.mitem .vl{display:grid;place-items:center;color:#fff;font-size:26px}
.mitem span{display:block;font-size:12px;padding:6px 7px;line-height:1.3}.mitem em{position:absolute;top:6px;left:6px;font-style:normal;font-size:10px;font-weight:700;background:#000a;color:#fff;border-radius:6px;padding:1px 6px}
.sheet{position:fixed;inset:0;z-index:55;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;max-height:82vh;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.viewer{position:fixed;inset:0;z-index:70;background:#000e;display:grid;place-items:center}.viewer img,.viewer video{max-width:96vw;max-height:90vh}
</style>
</head>
<body>
<div class="top"><span class="logo">GOLDCOOL</span><span class="sub">Sale Academy</span><span class="sp"></span><span class="who" id="who"></span></div>
<main id="app"></main>
<nav class="tabs hide" id="tabs"></nav>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let TOKEN=LS.get('gct')||'', META=null, CUR='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color=t=>t==null?'#98A2B3':t>=80?'#12805C':t>=65?'#B7791F':'#C2410C';
const verdict=t=>t>=85?'Xuất sắc':t>=75?'Đạt tốt':t>=65?'Đạt':t>=50?'Cần cố gắng':'Chưa đạt';
const SHORT={td:'Tủ đông 4-6C',tm:'Tủ mát 2-3C',bc:'Bàn chặt',sl:'Tủ salad',tb:'Trưng bày',gw:'GoldWash'};
const GC={td:'#2563EB',tm:'#0891B2',bc:'#7C3AED',sl:'#16A34A',tb:'#DB2777',gw:'#EA580C'};
const PN=p=>(META.personas[p]||'').split(':')[0];
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
async function api(action,data={}){
  const r=await fetch('/api/app',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({error:'Lỗi máy chủ ('+r.status+')'}));
  if(r.status===401){logout();throw new Error(j.error)}
  if(j.error)throw new Error(j.error);return j;
}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã sao chép')}catch(e){}a.remove()})}
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.6"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
 send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
 flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg>',
};

// ===== ĐĂNG NHẬP
function logout(){TOKEN='';LS.del('gct');META=null;document.querySelectorAll('.screen').forEach(s=>s.remove());renderLogin()}
function renderLogin(){
  $('#tabs').classList.add('hide');$('#who').textContent='';document.body.classList.remove('admin');
  app.innerHTML=`<div class="card login"><h1>Đăng nhập</h1><p class="mute">Mỗi Sale đăng nhập bằng tên và mã PIN quản lý cấp.</p>
  <label class="f">Tên</label><input id="ln" autocomplete="username">
  <label class="f">Mã PIN</label><div class="row" style="flex-wrap:nowrap"><input id="lp" type="tel" inputmode="numeric" autocomplete="off" placeholder="Nhập mã PIN" style="-webkit-text-security:disc"><button class="btn ghost" id="ls" type="button">Hiện</button></div>
  <p id="le" style="color:var(--bad);min-height:20px;margin:8px 0"></p>
  <button class="btn block" id="lb">Vào luyện tập</button></div>`;
  $('#ls').onclick=()=>{const i=$('#lp');const h=i.style.webkitTextSecurity==='none';i.style.webkitTextSecurity=h?'disc':'none';$('#ls').textContent=h?'Hiện':'Ẩn'};
  const go=async()=>{$('#le').textContent='';const b=$('#lb');b.disabled=true;b.textContent='Đang đăng nhập…';
    try{const r=await api('login',{name:$('#ln').value.trim(),pin:$('#lp').value.replace(/\s/g,'')});TOKEN=r.token;LS.set('gct',TOKEN);boot()}
    catch(e){$('#le').textContent=e.message||'Không đăng nhập được';b.disabled=false;b.textContent='Vào luyện tập'}};
  $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}

async function boot(){
  try{META=await api('meta')}catch(e){return renderLogin()}
  const ad=META.user.role==='admin';document.body.classList.toggle('admin',ad);
  $('#who').innerHTML=`${esc(META.user.name)} · <a href="#" id="out" style="color:#F3C34E">Thoát</a>`;$('#out').onclick=e=>{e.preventDefault();logout()};
  const tabs=ad?[['report','Báo cáo',I.chart],['path3','Lộ trình 3 ngày',I.flag],['review','Duyệt bài',I.check],['staff','Nhân viên',I.users],['sc','Tình huống',I.list],['media','Ảnh & Video',I.img],['docs','Tài liệu',I.book]]
               :[['path','Lộ trình',I.flag],['home','Hôm nay',I.home],['docs','Tài liệu',I.book],['me','Kết quả',I.chart]];
  const t=$('#tabs');t.classList.remove('hide');
  t.innerHTML=tabs.map(([k,v,ic])=>`<button data-k="${k}">${ic}<span>${v}</span></button>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));
  go(tabs[0][0]);
}
function go(k){CUR=k;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  app.innerHTML='<p class="mute" style="text-align:center;margin-top:40px">Đang tải…</p>';window.scrollTo(0,0);
  ({path:vPath,path3:vPath3,home:vHome,docs:vDocs,me:vMe,report:vReport,review:vReview,staff:vStaff,sc:vSc,media:vMedia})[k]().catch(e=>{app.innerHTML=`<div class="flag">${esc(e.message)}</div>`})}
function refresh(){if(CUR)go(CUR)}

// ===== HÔM NAY (SALE)
async function vHome(){
  const d=await api('plan');const s=d.stats;
  const next=d.tasks.find(t=>!t.done);const pct=Math.round(d.doneCount/d.quota*100);
  const byG={};d.tasks.forEach(t=>{(byG[t.g]||={n:0,d:0,sum:0});byG[t.g].n++;if(t.done){byG[t.g].d++;byG[t.g].sum+=t.done.total}});
  app.innerHTML=`
  <div class="card hero">
    <div class="row" style="flex-wrap:nowrap;gap:16px">
      <div class="ring" style="--p:${pct}"><div><b>${d.doneCount}/${d.quota}</b><span>cuộc</span></div></div>
      <div><h1>Chào ${esc(META.user.name)}</h1><div class="mute">${d.doneCount>=d.quota?'Đã hoàn thành chỉ tiêu hôm nay. Rất tốt!':`Hôm nay cần tư vấn ${d.quota} khách – còn ${d.quota-d.doneCount} cuộc.`}</div></div>
    </div>
    <div class="kp"><div><b>${d.todayAvg??'–'}</b><span>Điểm TB hôm nay</span></div><div><b>${s.streak}</b><span>Ngày liên tiếp</span></div><div><b>${s.avg??'–'}</b><span>TB 20 cuộc gần nhất</span></div></div>
  </div>
  ${!META.ai?'<div class="flag">AI chưa được bật – báo quản lý.</div>':''}
  ${next?`<button class="btn block" id="gonext" style="margin-bottom:12px;padding:14px">Bắt đầu cuộc ${next.n}: ${esc(SHORT[next.g])} →</button>`:''}

const KIND={anh:'Ảnh sản phẩm',video:'Video',feedback:'Feedback khách',maure:'Ảnh mẫu rẻ'};
let MEDIA=null;
async function getMedia(force){if(!MEDIA||force)MEDIA=(await api('media')).list;return MEDIA}
const isVid=t=>String(t||'').startsWith('video');
function mediaThumb(m){return `${isVid(m.type)?`<video src="${esc(m.url)}#t=0.5" preload="metadata" muted playsinline></video>`:m.type==='link'?'<div class="vl">▶</div>':`<img src="${esc(m.url)}" loading="lazy" alt="">`}<em>${esc(KIND[m.kind]||'')}</em><span>${esc(m.label)}</span>`}
function bubble(m){
  const md=m.media;
  if(!md)return `<div class="msg ${m.role==='user'?'me':'kh'}"><div class="bub">${esc(m.content)}</div></div>`;
  const inner=isVid(md.type)?`<video src="${esc(md.url)}" controls playsinline preload="metadata"></video>`:md.type==='link'?`<a class="lnk" href="${esc(md.url)}" target="_blank" rel="noopener"><i>▶</i>${esc(md.label)}</a>`:`<img src="${esc(md.url)}" loading="lazy" alt="" data-view="${esc(md.url)}">`;
  return `<div class="msg ${m.role==='user'?'me':'kh'}"><div class="bub md">${inner}${md.type!=='link'?`<div class="cap">${esc(KIND[md.kind]||'Ảnh')}: ${esc(md.label)}</div>`:''}</div></div>`;
}
function bindView(root){root.querySelectorAll('[data-view]').forEach(i=>i.onclick=()=>{const v=document.createElement('div');v.className='viewer';v.innerHTML=`<img src="${esc(i.dataset.view)}">`;v.onclick=()=>v.remove();document.body.appendChild(v)})}
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<900000)return file;
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
  const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85));return new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});
}
async function uploadFile(file,onProg){
  file=await shrink(file);
  const {upload}=await import('https://esm.sh/@vercel/blob@1.0.0/client');
  const name='media/'+Date.now()+'-'+file.name.normalize('NFD').replace(/[^\w.]+/g,'-').slice(-60);
  const b=await upload(name,file,{access:'public',handleUploadUrl:'/api/upload',clientPayload:JSON.stringify({token:TOKEN}),onUploadProgress:p=>onProg&&onProg(Math.round(p.percentage))});
  return {url:b.url,type:file.type||(/\.(mp4|mov|webm)$/i.test(file.name)?'video/mp4':'image/jpeg')};
}

function screen(html,cls=''){const s=document.createElement('div');s.className='screen';s.innerHTML=html;document.body.appendChild(s);document.body.style.overflow='hidden';
  s.close=()=>{s.remove();if(!document.querySelector('.screen'))document.body.style.overflow=''};return s}
async function openChat(opt){
  let info;try{info=await api('startTask',opt.n?{n:opt.n}:{g:opt.g,persona:opt.persona,sid:opt.sid})}catch(e){return toast(e.message)}
  const ctx={n:opt.n||null,sid:info.sid||null,g:info.g,persona:info.persona};
  const msgs=[{role:'assistant',content:info.first}];let busy=false,ended=false,scored=false;
  const s=screen(`<div class="bar2"><button class="back" id="bk">‹</button><div class="av">${esc(PN(info.persona)[0]||'K')}</div>
    <div class="ttl"><b>Khách · ${esc(SHORT[info.g])}</b><span>${opt.n?`Cuộc ${opt.n}/${opt.total} · `:'Luyện thêm · '}${esc(PN(info.persona))}</span></div>
    <button class="btn sm" id="fin">Chấm điểm</button></div>
   <div class="body chatbody" id="bd"><div class="inner">
    <div class="ctx"><b>${esc(info.title)}</b> <span class="pill">${esc(info.stage)}</span><div style="margin-top:4px">${esc(info.ctx)}</div>
     <div style="margin-top:6px"><a href="#" id="tg" style="color:var(--gold);font-weight:700">💡 Gợi ý quy trình</a></div>
     <ul class="c hide" id="tips">${(info.tips||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div id="log"></div></div></div>
   <div class="composer" id="cp"><div class="inner"><button class="attach" id="at" title="Gửi ảnh / video">📎</button><textarea id="tx" rows="1" placeholder="Nhắn cho khách như trên Zalo…"></textarea><button class="send" id="sd">${I.send}</button></div></div>`);
  const log=s.querySelector('#log'),bd=s.querySelector('#bd'),tx=s.querySelector('#tx');
  s.querySelector('#tg').onclick=e=>{e.preventDefault();s.querySelector('#tips').classList.toggle('hide')};
  const draw=()=>{log.innerHTML=msgs.map(bubble).join('')+(busy==='typing'?'<div class="msg kh typing"><div class="bub">Khách đang nhắn…</div></div>':'')+(ended&&!scored?'<div class="sys">Khách đã kết thúc cuộc chat · bấm “Chấm điểm”</div>':'');bindView(log);bd.scrollTop=bd.scrollHeight;log.querySelectorAll('img,video').forEach(x=>x.addEventListener('load',()=>bd.scrollTop=bd.scrollHeight,{once:true}))};
  draw();
  tx.oninput=()=>{tx.style.height='auto';tx.style.height=Math.min(tx.scrollHeight,180)+'px'};
  tx.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}};
  // Sale có thể gửi liền nhiều tin (chữ + ảnh + video), khách trả lời sau khi Sale ngừng gửi ~2 giây
  let timer=null,pending=false;
  const plain=()=>msgs.map(({role,content})=>({role,content}));
  const reply=async()=>{if(ended||scored)return;if(busy){pending=true;return}busy='typing';draw();
    try{const r=await api('chat',{...ctx,messages:plain()});msgs.push({role:'assistant',content:r.reply});if(r.end)ended=true}
    catch(e){toast(e.message)}busy=false;draw();if(pending){pending=false;schedule()}};
  const schedule=()=>{clearTimeout(timer);timer=setTimeout(reply,2000)};
  const send=()=>{const v=tx.value.trim();if(!v||scored)return;msgs.push({role:'user',content:v});tx.value='';tx.oninput();draw();schedule()};
  s.querySelector('#sd').onclick=send;
  s.querySelector('#at').onclick=()=>{if(scored)return;openPicker(info.g,md=>{msgs.push({role:'user',content:`[${KIND[md.kind]||'Ảnh'}: ${md.label}]`,media:md});draw();schedule()})};
  s.querySelector('#bk').onclick=()=>{if(!scored&&msgs.length>2&&!confirm('Thoát sẽ bỏ cuộc chat này (chưa chấm). Thoát?'))return;s.close();if(scored)refresh()};
  s.querySelector('#fin').onclick=async e=>{if(scored)return;clearTimeout(timer);const b=e.target;b.disabled=true;b.textContent='Đang chấm…';
    log.insertAdjacentHTML('beforeend','<div class="sys" id="wait">AI đang chấm điểm cuộc tư vấn…</div>');bd.scrollTop=bd.scrollHeight;
    try{const r=await api('finishChat',{...ctx,messages:msgs});scored=true;b.remove();
      s.querySelector('#wait')?.remove();log.insertAdjacentHTML('beforeend',resultHTML(r.attempt,r.sample));bindCopy(log);
      s.querySelector('#cp').innerHTML=`<div class="inner" style="gap:8px">${opt.n?'<button class="btn" id="nx" style="flex:2">Cuộc tiếp theo →</button>':''}<button class="btn ghost" id="hm" style="flex:1;white-space:nowrap">Về trang chính</button></div>`;
      s.querySelector('#hm').onclick=()=>{s.close();refresh()};
      if(opt.n)s.querySelector('#nx').onclick=async()=>{s.close();const p=await api('plan');const nx=p.tasks.find(t=>!t.done);if(CUR==='home')vHome();if(nx)openChat({n:nx.n,total:p.quota});else toast('Đã xong chỉ tiêu hôm nay!')};
      setTimeout(()=>s.querySelector('.res')?.scrollIntoView({behavior:'smooth'}),50);
    }catch(err){s.querySelector('#wait')?.remove();toast(err.message);b.disabled=false;b.textContent='Chấm điểm'}};
  setTimeout(()=>tx.focus(),100);
}

  app.innerHTML=`

   <h1>Lộ trình 3 ngày</h1><div class="mute">Học – kiểm tra – đóng vai đủ 6 nhóm sản phẩm. Đạt cả 3 ngày và được Giám đốc xác nhận thì mới nhận khách thật.</div>
   <div class="row" style="margin-top:14px;flex-wrap:nowrap;gap:6px">${[['Ngày 1','Nền tảng',d.d1],['Ngày 2','6 nhóm & giá',d.d2],['Ngày 3','Đóng vai AI',d.d3]].map(([a,b,ok],i)=>`<div style="flex:1;display:flex;gap:8px;align-items:center;min-width:0">${stepDot(ok,cur===i+1,i+1)}<div style="min-width:0;line-height:1.2"><b style="font-size:13px">${a}</b><div class="mute" style="font-size:11px">${b}</div></div></div>`).join('')}</div>
   <div style="margin-top:14px;background:#ffffff14;border-radius:12px;padding:10px 12px"><span class="mute">Kết luận: </span><b style="color:${s.signoff?'#7CE3B5':s.passed?'#F3C34E':'#fff'}">${s.signoff?'✓ ĐẠT – Đủ điều kiện nhận khách thật':s.passed?'ĐẠT – chờ Giám đốc xác nhận':'CHƯA ĐẠT'}</b>${s.signoff?`<div class="mute" style="font-size:12px">Xác nhận bởi ${esc(s.signoff.by)} ngày ${s.signoff.date.split('-').reverse().join('/')}</div>`:''}</div>
  </div>

  <div class="card"><div class="row"><h2 style="margin:0">Ngày 1 · Nền tảng</h2><span class="sp"></span>${d.d1?'<span class="pill" style="background:#E3F4EC;color:var(--ok)">Đạt</span>':''}</div>
   <p class="mute">Đọc DNA và quy tắc tư vấn chung, rồi làm bài kiểm tra.</p>
   <div class="row" style="margin-bottom:6px"><button class="btn ghost sm" data-doc="dna">📖 DNA GoldCool</button><button class="btn ghost sm" data-doc="chung">📖 Quy tắc tư vấn chung</button></div>
   <div class="list">${quizRow(q('nen'))}</div></div>

  <div class="card"><div class="row"><h2 style="margin:0">Ngày 2 · 6 nhóm sản phẩm & bảng giá</h2><span class="sp"></span>${d.d2?'<span class="pill" style="background:#E3F4EC;color:var(--ok)">Đạt</span>':''}</div>
   <p class="mute">${d.d1?'Mỗi nhóm: đọc tài liệu rồi làm 5 câu (cần ≥ 80%). Bài bảng giá phải đúng 100%.':'🔒 Mở khi đạt bài Ngày 1.'}</p>
   <div class="list">${['td','tm','bc','sl','tb','gw'].map(g=>{const x=q(g);return `<div style="display:flex;gap:8px;align-items:center"><span class="dot" style="width:10px;height:10px;background:${GC[g]}"></span><div style="flex:1;min-width:0">${quizRow(x,!d.d1)}</div><button class="copy" data-doc="${g}" title="Đọc tài liệu">📖</button></div>`}).join('')}
    ${quizRow(q('gia'),!d.d1)}</div></div>

  <div class="card"><div class="row"><h2 style="margin:0">Ngày 3 · Đóng vai với khách AI</h2><span class="sp"></span>${d.d3?'<span class="pill" style="background:#E3F4EC;color:var(--ok)">Đạt</span>':''}</div>
   <p class="mute">Mỗi nhóm cần ≥ ${s.rule.minCalls} cuộc và điểm TB ≥ ${s.rule.minAvg}. Các cuộc ở tab "Hôm nay" cũng được tính. Bấm nhóm để luyện thêm.</p>
   <div class="list">${s.rp.map(x=>`<div class="it" data-rp="${x.g}"><span class="dot" style="width:10px;height:10px;background:${GC[x.g]}"></span><div class="t"><b style="font-size:14px">${esc(x.name)}</b><div class="mute">${x.n}/${s.rule.minCalls} cuộc${x.avg!=null?` · TB ${x.avg}`:''}</div><div class="prog"><i style="width:${Math.min(100,(x.avg||0))}%;background:${x.passed?'var(--ok)':color(x.avg)}"></i></div></div>${x.passed?'<span class="sc" style="background:var(--ok)">✓</span>':''}<span class="go" style="color:var(--gold)">Luyện ›</span></div>`).join('')}</div></div>

  ${s.missing.length&&!s.signoff?`<div class="card"><h2>Còn thiếu để Đạt</h2><ul class="c">${s.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:''}`;
  app.querySelectorAll('[data-doc]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDoc(b.dataset.doc)});
  app.querySelectorAll('[data-quiz]').forEach(el=>el.onclick=()=>{if(el.dataset.locked)return toast('Cần đạt bài Ngày 1 trước');quizScreen(el.dataset.quiz)});
  app.querySelectorAll('[data-rp]').forEach(el=>el.onclick=()=>{const ks=Object.keys(META.personas);openChat({g:el.dataset.rp,persona:ks[Math.floor(Math.random()*ks.length)]})});
}

async function quizScreen(id){
  let z;try{z=await api('quizGet',{id})}catch(e){return toast(e.message)}
  const ans={};
  const s=screen(`<div class="bar2"><button class="back" id="bk">‹</button><div class="ttl"><b>${esc(z.title)}</b><span>Ngày ${z.day} · ${z.qs.length} câu · cần ≥ ${z.pass}%</span></div><span id="cnt" style="font-weight:700">0/${z.qs.length}</span></div>
   <div class="body"><div class="inner" id="qb">
    ${z.qs.map((x,i)=>`<div class="card" data-q="${x.id}"><b>Câu ${i+1}. ${esc(x.text)}</b><div style="margin-top:8px">${x.opts.map(o=>`<button class="pcard" data-k="${o.k}" style="width:100%;margin:5px 0;display:block"><span style="font-size:14px;color:var(--text)">${esc(o.t)}</span></button>`).join('')}</div></div>`).join('')}
    <button class="btn block" id="sub" style="padding:14px;margin-bottom:20px">Nộp bài</button></div></div>`);
  const close=()=>{s.close();if(CUR==='path')vPath()};
  s.querySelector('#bk').onclick=()=>{if(Object.keys(ans).length&&!s.dataset.done&&!confirm('Thoát sẽ bỏ bài đang làm. Thoát?'))return;close()};
  s.querySelectorAll('[data-q]').forEach(c=>c.onclick=e=>{const b=e.target.closest('.pcard');if(!b||s.dataset.done)return;ans[c.dataset.q]=b.dataset.k;c.querySelectorAll('.pcard').forEach(x=>x.classList.toggle('on',x===b));s.querySelector('#cnt').textContent=Object.keys(ans).length+'/'+z.qs.length});
  s.querySelector('#sub').onclick=async e=>{
    if(Object.keys(ans).length<z.qs.length){const i=z.qs.findIndex(x=>!ans[x.id]);toast('Còn câu chưa trả lời');s.querySelector(`[data-q="${z.qs[i].id}"]`).scrollIntoView({behavior:'smooth',block:'center'});return}
    const b=e.target;b.disabled=true;b.textContent='Đang chấm…';
    try{const {result:r}=await api('quizSubmit',{id,answers:ans});s.dataset.done='1';
      const det=Object.fromEntries(r.detail.map(d=>[d.id,d]));
      s.querySelectorAll('[data-q]').forEach(c=>{const d=det[c.dataset.q];c.querySelectorAll('.pcard').forEach(x=>{if(x.dataset.k===d.right)x.style.cssText+=';border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset;background:#EEF9F3';else if(x.dataset.k===d.pick)x.style.cssText+=';border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset;background:#FFF1EA'});
        c.insertAdjacentHTML('beforeend',`<div class="${d.ok?'pre':'flag'}" style="margin-top:8px;font-weight:400">${d.ok?'✓ Đúng. ':'✗ Sai. '}${esc(d.why)}</div>`)});
      b.remove();
      s.querySelector('#qb').insertAdjacentHTML('afterbegin',`<div class="res"><div class="row" style="flex-wrap:nowrap;gap:14px"><div class="big" style="background:${r.passed?'var(--ok)':'var(--bad)'}">${r.pct}%</div><div><b style="font-size:17px">${r.passed?'ĐẠT':'CHƯA ĐẠT'}</b><div class="mute">Đúng ${r.correct}/${r.total} câu · cần ≥ ${z.pass}%</div></div></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="again" style="flex:1">Làm lại</button><button class="btn ghost" id="back2" style="flex:1">Về lộ trình</button></div>
        ${r.passed?'':'<p class="mute" style="margin-bottom:0">Xem giải thích từng câu bên dưới, đọc lại tài liệu rồi làm lại.</p>'}</div>`);
      s.querySelector('.body').scrollTop=0;
      s.querySelector('#again').onclick=()=>{s.close();quizScreen(id)};s.querySelector('#back2').onclick=close;
    }catch(err){toast(err.message);b.disabled=false;b.textContent='Nộp bài'}};
}

// ===== QUẢN LÝ: LỘ TRÌNH 3 NGÀY
async function vPath3(){
  const d=await api('adminPath3');
  const QS=['nen','td','tm','bc','sl','tb','gw','gia'];const QN={nen:'Nền tảng',gia:'Bảng giá',...SHORT};
  const verdictOf=s=>s.signoff?['Đủ ĐK nhận khách','var(--ok)']:s.passed?['Đạt – chờ xác nhận','var(--mid)']:['Chưa đạt · '+s.stage,'var(--bad)'];
  const n=d.rows.length,pass=d.rows.filter(r=>r.status.passed).length,ok=d.rows.filter(r=>r.status.signoff).length;
  app.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Lộ trình 3 ngày – kết quả đầu ra</h2><span class="sp"></span><button class="btn sm" id="cpz">Sao chép gửi Zalo</button></div>
   <div class="kp" style="grid-template-columns:repeat(3,1fr)">${[['Sale đang học',n],['Đã Đạt',pass],['Đã xác nhận nhận khách',ok]].map(([a,b])=>`<div style="background:#F5F7FA"><b style="color:var(--navy)">${b}</b><span class="mute">${a}</span></div>`).join('')}</div>
   <p class="mute" style="margin-bottom:0">Đạt khi: bài Nền tảng ≥ 90% · 6 bài nhóm ≥ 80% · bài Bảng giá 100% · đóng vai mỗi nhóm ≥ ${d.rows[0]?.status.rule.minCalls??2} cuộc, TB ≥ ${d.rows[0]?.status.rule.minAvg??75}.</p></div>
  <div class="card"><div class="tw"><table><tr><th>Sale</th><th>Kết luận</th>${QS.map(k=>`<th>KT ${QN[k]}</th>`).join('')}${Object.keys(SHORT).map(g=>`<th><span class="dot" style="background:${GC[g]}"></span> Đóng vai ${SHORT[g]}</th>`).join('')}<th></th></tr>
   ${d.rows.map(r=>{const s=r.status;const [vt,vc]=verdictOf(s);return `<tr><td><a href="#" data-u="${r.id}" style="color:var(--navy);font-weight:700">${esc(r.name)}</a><div class="mute">${r.started?'Bắt đầu '+r.started.split('-').reverse().join('/'):'Chưa bắt đầu'}</div></td>
    <td><b style="color:${vc}">${vt}</b>${s.weak?`<div class="mute">Yếu: ${SHORT[s.weak.g]} (${s.weak.avg})</div>`:''}</td>
    ${QS.map(k=>{const x=s.quizzes.find(q=>q.id===k);return `<td><span class="cell" style="background:${x.best==null?'#F2F4F7':pctColor(x.best,x.pass)};color:${x.best==null?'#98A2B3':'#fff'}">${x.best==null?'–':x.best+'%'}</span>${x.tries>1?`<div class="mute" style="font-size:11px">${x.tries} lần</div>`:''}</td>`}).join('')}
    ${s.rp.map(x=>`<td><span class="cell" style="background:${x.avg==null?'#F2F4F7':x.passed?'var(--ok)':color(x.avg)};color:${x.avg==null?'#98A2B3':'#fff'}">${x.avg??'–'}</span><div class="mute" style="font-size:11px">${x.n} cuộc</div></td>`).join('')}
    <td>${s.signoff?`<button class="btn ghost sm" data-undo="${r.id}">Hủy xác nhận</button>`:s.passed?`<button class="btn sm" data-ok="${r.id}">Xác nhận nhận khách</button>`:''}</td></tr>`}).join('')||`<tr><td colspan="17" class="mute">Chưa có Sale – vào tab Nhân viên để tạo tài khoản.</td></tr>`}
  </table></div><p class="mute">Bấm tên Sale để xem điều còn thiếu và lịch sử bài kiểm tra.</p></div>`;
  $('#cpz').onclick=()=>copyText(`KẾT QUẢ LỘ TRÌNH 3 NGÀY – ${META.today.split('-').reverse().join('/')}\n`+d.rows.map((r,i)=>{const s=r.status;return `${i+1}. ${r.name}: ${verdictOf(s)[0]}${s.weak?` · yếu nhất ${SHORT[s.weak.g]} (${s.weak.avg})`:''}${!s.passed&&s.missing.length?` · còn thiếu ${s.missing.length} mục`:''}`}).join('\n'));
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const r=d.rows.find(x=>x.id===b.dataset.ok);if(!confirm(`Xác nhận ${r.name} đủ điều kiện nhận khách thật?`))return;try{await api('adminSignoff3',{userId:r.id});toast('Đã xác nhận');vPath3()}catch(e){toast(e.message)}});
  app.querySelectorAll('[data-undo]').forEach(b=>b.onclick=async()=>{if(!confirm('Hủy xác nhận?'))return;try{await api('adminSignoff3',{userId:b.dataset.undo,undo:true});vPath3()}catch(e){toast(e.message)}});
  app.querySelectorAll('[data-u]').forEach(a=>a.onclick=async e=>{e.preventDefault();const r=d.rows.find(x=>x.id===a.dataset.u);const s=r.status;const l=(await api('adminQuizAttempts',{userId:r.id})).list;
    const sc=screen(`<div class="bar2"><button class="back" id="bk">‹</button><div class="ttl"><b>${esc(r.name)}</b><span>${verdictOf(s)[0]}</span></div></div>
     <div class="body"><div class="inner">
      ${s.missing.length?`<div class="card"><h2>Còn thiếu để Đạt</h2><ul class="c">${s.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:'<div class="card"><b style="color:var(--ok)">Đã đủ điều kiện Đạt.</b></div>'}
      <div class="card"><h2>Bài kiểm tra đã làm (${l.length})</h2><div class="list">${l.map((x,i)=>`<div class="it" data-i="${i}"><div class="t"><b style="font-size:14px">${esc(QN[x.quiz]||x.quiz)}</b><div class="mute">${x.date.split('-').reverse().join('/')} · đúng ${x.correct}/${x.total}</div></div><span class="sc" style="background:${x.passed?'var(--ok)':'var(--bad)'}">${x.pct}%</span></div>`).join('')||'<p class="mute">Chưa làm bài nào.</p>'}</div></div>
      <div id="qd"></div></div></div>`);
    sc.querySelector('#bk').onclick=()=>sc.close();
    sc.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const x=l[el.dataset.i];sc.querySelector('#qd').innerHTML=`<div class="card"><h2>Câu sai – ${esc(QN[x.quiz]||x.quiz)} ${x.date.split('-').reverse().join('/')}</h2>${x.detail.filter(q=>!q.ok).map(q=>`<div style="margin:10px 0"><b style="font-size:14px">${esc(q.text)}</b><div class="flag" style="font-weight:400">Chọn: ${esc(q.pickText||'–')}</div><div class="pre">Đúng: ${esc(q.rightText)}</div></div>`).join('')||'<p class="mute">Không sai câu nào.</p>'}</div>`;sc.querySelector('#qd').scrollIntoView({behavior:'smooth'})});
  });
}
